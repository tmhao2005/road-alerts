<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon: the road ahead with the real speed sign standing over it, in the
       HUD's own colours. Rendered to the PNG sizes iOS and Android ask for. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE5F0"/>
      <stop offset="0.52" stop-color="#EAEEF3"/>
      <stop offset="1" stop-color="#F4F5F7"/>
    </linearGradient>
    <linearGradient id="ahead" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#007AFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#007AFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#10141E" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <path d="M188 1024 L476 560 L548 560 L836 1024 Z" fill="#CBD0D8"/>
  <path d="M222 1024 L480 560 L544 560 L802 1024 Z" fill="#FFFFFF"/>
  <path d="M300 1024 L490 560 L534 560 L724 1024 Z" fill="url(#ahead)"/>
  <path d="M512 1024 L512 952 M512 900 L512 850 M512 808 L512 772 M512 738 L512 712 M512 684 L512 666" stroke="#8E949E" stroke-width="10" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="512" cy="392" r="252" fill="#D92B34"/>
  </g>
  <circle cx="512" cy="392" r="186" fill="#FFFFFF"/>
  <text x="512" y="392" dy="0.35em" text-anchor="middle" font-family="Be Vietnam Pro, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="196" letter-spacing="-8" fill="#15161A">60</text>
</svg>
