name: Deploy test app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      # Geofabrik refreshes the extract daily; a weekly cache keeps map data reasonably
      # fresh without downloading 315 MB on every push.
      - name: Week number for the map cache
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/vietnam-latest.osm.pbf
          key: osm-vietnam-${{ steps.week.outputs.week }}

      - run: npm test
      - run: sh tools/prep-hcm.sh
      - run: sh tools/build-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
